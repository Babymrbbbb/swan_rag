# swan_rag · Kubernetes Deployment
# 生产规范清单：副本、资源限制、健康检查、环境变量从 Secret 注入。
# 应用：kubectl apply -f k8s/
apiVersion: apps/v1
kind: Deployment
metadata:
  name: swan-rag
  labels:
    app: swan-rag
spec:
  # 生产建议 ≥2 副本；配合 HPA 可水平扩缩容
  replicas: 2
  selector:
    matchLabels:
      app: swan-rag
  template:
    metadata:
      labels:
        app: swan-rag
    spec:
      containers:
        - name: swan-rag
          image: swan-rag:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          # 环境变量：非敏感配置直接写；敏感配置（LLM API Key 等）从 Secret 注入
          env:
            - name: RAG_API_KEY
              valueFrom:
                secretKeyRef:
                  name: swan-rag-secret
                  key: api-key
            - name: RAG_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: swan-rag-secret
                  key: llm-api-key
            # 演示默认 mock；生产改为 real 并配 base_url/model
            - name: RAG_LLM_PROVIDER
              value: "mock"
            - name: RAG_EMBEDDER_PROVIDER
              value: "mock"
          # 资源请求与限制：让调度器有依据、HPA 有度量
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          # 就绪探针：/health 返回 200 才接流量
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          # 存活探针：/health 连续失败则重启容器
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10