# swan_rag · Kubernetes Secret 模板
# 复制为 secret.yaml 并填入真实值（base64 编码），不要提交真实密钥到仓库。
# 生成方式：
#   echo -n '你的APIKey' | base64
apiVersion: v1
kind: Secret
metadata:
  name: swan-rag-secret
type: Opaque
data:
  # base64 编码的全局鉴权 Key（对应 RAG_API_KEY）
  api-key: "ZGV2LXNlY3JldC1rZXk="   # dev-secret-key
  # base64 编码的 LLM API Key（对应 RAG_LLM_API_KEY），生产必填
  llm-api-key: ""